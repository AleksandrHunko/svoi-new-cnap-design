<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="/src/input.css" rel="stylesheet">
</head>

<body class="w-full color-style-5">
    <main>
        <div class="flex gap-2 mt-4 px-4 lg:px-[6%] xl:px-[8%] 2xl:px-[10%]">
            <a class="hover:text-colored text-small text-[#959595] font-normal" href="/">Головна</a>
            <svg class="w-2 h-4" class="cursor-pointer" fill="#959595" width="18" height="29" viewBox="0 0 18 29" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M11.1611 14.1775L0 3.01642L2.97751 0L17.1551 14.1775L2.97751 28.3551L0 25.3387L11.1611 14.1775Z" />
            </svg>
            <p class="text-small font-normal">Електронна приймальня</p>
        </div>
        <section class="section-wrapper">
            <h1 class="text-biggest mb-16">Електронна приймальня</h1>

                <div class="flex flex-col md:flex-row gap-16">
                    <div class="flex-1 shrink-0 w-full">
                        <h3 class="text-medium mb-8">Напишіть своє звернення до ЦНАП</h3>
    
                        <form action="" method="post">
                            <div class="relative w-full border-b-2 pb-2 mb-8">
                                <select class="appearance-none cursor-pointer w-full pr-6 text-regular focus:outline-none">
                                    <option value="" selected disabled>Оберіть тему</option>
                                    <option value="1">Звернення</option>
                                    <option value="2">Запит на публічну інформацію</option>
                                    <option value="3">Повідомлення про корупцію</option>
                                    <option value="4">Скарга</option>
                                </select>
                                <svg
                                  class="pointer-events-none absolute right-0 top-1/2 -translate-y-1/2 h-4 w-4"
                                  width="16" height="16" viewBox="0 0 10 6" fill="currentColor" xmlns="http://www.w3.org/2000/svg"
                                  aria-hidden="true">
                                  <path d="M0 0h10L5 6z"></path>
                                </svg>
                            </div>
                            <div class="styled-input w-full">
                                <input name="name" type="text" autocomplete="off" required id="cases-form-name">
                                <label class="input-label" for="cases-form-name">
                                    <span class="input-span">ПІБ</span>
                                </label>
                            </div>
                            <div class="styled-input w-full">
                                <input
                                    name="phone"
                                    type="text"
                                    id="cases-form-phone"
                                    class="always-up"
                                    required
                                    autocomplete="off"
                                    placeholder="+38 (099) 999-99-99"
                                >
                                <label class="input-label" for="cases-form-phone">
                                    <span class="input-span">Телефон</span>
                                </label>
                            </div>
                            <div class="styled-input w-full">
                                <input name="email" type="email" autocomplete="off" required>
                                <label class="input-label" for="form-application-email">
                                    <span class="input-span">Email</span>
                                </label>
                            </div>
                            <div class="styled-input w-full">
                                <input name="index" type="text" autocomplete="off" required="" id="form-applicatipn-index">
                                <label class="input-label" for="form-application-index">
                                    <span class="input-span">Індекс</span>
                                </label>
                            </div>
                            <div class="styled-input w-full">
                                <input name="address" type="text" autocomplete="off" required id="cases-form-address">
                                <label class="input-label" for="cases-form-address">
                                    <span class="input-span">Адреса (фактичне проживання)</span>
                                </label>
                            </div>
                            <div class="relative w-full border-b-2 mt-12 mb-8 pb-2">
                                <select class="appearance-none cursor-pointer w-full pr-6 text-regular focus:outline-none" name="answer_type" required>
                                    <option value="" selected="">Як надати відповідь?</option>
                                    <option value="1">Електронною поштою</option>
                                    <option value="2">Поштовим зв`язком</option>
                                </select>
                                <svg
                                  class="pointer-events-none absolute right-0 top-1/2 -translate-y-1/2 h-4 w-4"
                                  width="16" height="16" viewBox="0 0 10 6" fill="currentColor" xmlns="http://www.w3.org/2000/svg"
                                  aria-hidden="true">
                                  <path d="M0 0h10L5 6z"></path>
                                </svg>
                            </div>
                            <div class="styled-textarea w-full">
                                <textarea class="resize-y" name="text_message" type="text" autocomplete="off" required id="cases-form-text-message"></textarea>
                                <label class="input-label" for="cases-form-text-message">
                                    <span class="input-span"></span>
                                </label>
                                <span class="textarea-span">Текстове звернення</span>
                            </div>
                            <div class="my-4 flex items-center gap-3">
                                <input class="border-black rounded-md w-5 h-5" type="checkbox" value="1" id="allow" name="allow" checked required>
                                <label class="text-regular font-light w-3/5" for="allow">
                                    Даю згоду на обробку персональних даних
                                </label>
                            </div>
                            <br>
                            <button class="cursor-pointer button-black text-center w-full" type="submit" class="black-button">
                                Відправити
                            </button>
                        </form>
                    </div>
                    <div class="bg-colored flex flex-col gap-2 items-center justify-between flex-1 py-8 px-16 rounded-3xl">
                        <h2 class="text-big text-center mb-8">Оцініть роботу Цнапу</h2>
                        <p class="text-small font-normal text-center mb-8">Що б залишити відгук перейдіть за посиланням або наведіть камерою смартфона на QR-код</p>
                        <img class="w-1/2 h-auto" src="/img/qr-sample.png" alt="">
                        <a class="block button-transparent my-4 py-3 w-52 text-center" href="">У Вайбері</a>
                        <img class="w-1/2 h-auto" src="/img/qr-sample.png" alt="">
                        <a class="block button-transparent my-4 py-3 w-52 text-center" href="">У Телеграмі</a>
                    </div>
                </div>

        </section>
    </main>
</body>
<script type="module" src="/js/main.js"></script>

</html>
