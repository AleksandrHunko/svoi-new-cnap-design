<!DOCTYPE html>
<html lang="uk">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="/src/input.css" rel="stylesheet">
</head>

<body class="w-full color-style-5">
  <main>
    <div class="flex gap-2 mt-5 px-4 lg:px-[6%] xl:px-[8%] 2xl:px-[10%]">
      <a class="hover:text-colored text-small text-[#959595] font-normal" href="/">Головна</a>
      <svg class="w-2 h-4 shrink-0" class="cursor-pointer" fill="#959595" width="18" height="29"
          viewBox="0 0 18 29" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
              d="M11.1611 14.1775L0 3.01642L2.97751 0L17.1551 14.1775L2.97751 28.3551L0 25.3387L11.1611 14.1775Z" />
      </svg>
      <a class="hover:text-colored text-small text-[#959595] font-normal" href="/queue">Е-Черга</a>
      <svg class="w-2 h-4 shrink-0" class="cursor-pointer" fill="#959595" width="18" height="29"
          viewBox="0 0 18 29" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path
              d="M11.1611 14.1775L0 3.01642L2.97751 0L17.1551 14.1775L2.97751 28.3551L0 25.3387L11.1611 14.1775Z" />
      </svg>
      <p class="text-small font-normal">Реєстрація</p>
    </div>
    <section class="section-wrapper">
      <h1 class="text-biggest mb-10">Підтвердження реєстрації в чергу</h1>
      <div class="queue-content">
        <div class="day"></div>
        <div class="time"></div>
      </div>
      <p class="text-regular font-light mb-8">
        УВАГА! Ви забронювали місце в черзі. Якщо Ви не підтвердите реєстрацію протягом <span
            class="font-medium">30 хвилин</span>, місце може бути втрачено.
      </p>
      <form class="queue-data-form bg-colored w-full md:w-2/3 mx-auto px-8 sm:px-12 py-6 sm:py-10 rounded-3xl">
        <div class="relative border-b-2 pb-4 w-full mb-8">
          <select name="type" id="fixedgroup"
              class="appearance-none cursor-pointer w-full pr-6 text-custom-20px focus:outline-none">
              <option  value="" disabled selected>Оберіть тип послуги</option>
          </select>
          <svg class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 h-4 w-4" width="16"
              height="16" viewBox="0 0 10 6" fill="currentColor" xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true">
              <path d="M0 0h10L5 6z"></path>
          </svg>
        </div>
        <div class="hidden relative border-b-2 pb-4 w-full mb-8">
          <select name="type" id="service-id"
              class="appearance-none cursor-pointer w-full pr-6 text-custom-20px focus:outline-none">
              <option  value="" disabled selected>Оберіть тип послуги</option>
          </select>
          <svg class="pointer-events-none absolute right-2 top-1/2 -translate-y-1/2 h-4 w-4" width="16"
              height="16" viewBox="0 0 10 6" fill="currentColor" xmlns="http://www.w3.org/2000/svg"
              aria-hidden="true">
              <path d="M0 0h10L5 6z"></path>
          </svg>
        </div>
        <div class="styled-input">
          <input name="name" type="text" autocomplete="off" required="" id="form-queue-inner-name" />
          <label class="input-label" for="form-queue-inner-name">
              <span class="input-span">ПІБ</span>
          </label>
      </div>
      <div class="styled-input">
          <input name="tel" type="text" id="form-queue-inner-tel" class="always-up" required
              autocomplete="off" placeholder="+38 (099) 999-99-99">
          <label class="input-label" for="form-queue-inner-tel">
              <span class="input-span">Номер телефону</span>
          </label>
      </div>
      <input type="checkbox" value="1" id="allow" name="allow" checked="" required>
      <label class="text-regular cursor-pointer" for="allow">
          Даю згоду на обробку персональних даних
      </label>
      <button type="submit" id="queue-button" class="cursor-pointer button-black mt-10 w-full md:w-2/3 lg:w-1/2">Відправити</button>

      </form>
    </section>
  </main>
</body>
<script src="/js/queue-diia-register.js"></script>
<script>Inputmask("+38 (099) 999-99-99").mask("#form-queue-inner-tel")</script>
</html>
