<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Responsive Tailwind Gallery</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://unpkg.com/photoswipe@5/dist/photoswipe.css"
    />
  </head>

  <body class="bg-gray-100 flex justify-center items-center min-h-screen p-4">

    <!-- GALLERY WRAPPER -->
    <div class="relative w-full max-w-6xl">
      <!-- Slider Controls -->
      <button
        id="prevBtn"
        class="absolute left-0 top-1/2 -translate-y-1/2 z-10 bg-white/80 hover:bg-white text-gray-700 rounded-full p-2 shadow-md"
      >
        &#8592;
      </button>
      <button
        id="nextBtn"
        class="absolute right-0 top-1/2 -translate-y-1/2 z-10 bg-white/80 hover:bg-white text-gray-700 rounded-full p-2 shadow-md"
      >
        &#8594;
      </button>

      <!-- SCROLLABLE GALLERY -->
      <div
        id="galleryContainer"
        class="grid grid-flow-col auto-cols-[calc(100%)] sm:auto-cols-[calc(50%)] lg:auto-cols-[calc(33.333%)] gap-4 overflow-x-auto scroll-smooth snap-x snap-mandatory p-2"
        style="scrollbar-width: none;"
      >
        <!-- Each "cell" is its own small grid of 2 rows -->
        <div class="grid grid-rows-2 gap-4 snap-start">
          <a href="./img/cabinet-1.png" data-pswp-width="1280" data-pswp-height="720">
            <img src="./img/cabinet-1.png" class="w-full h-full object-cover rounded-lg hover:scale-105 transition-transform" alt="">
          </a>
          <a href="./img/cabinet-2.jpg" data-pswp-width="1280" data-pswp-height="720">
            <img src="./img/cabinet-2.jpg" class="w-full h-full object-cover rounded-lg hover:scale-105 transition-transform" alt="">
          </a>
        </div>

        <div class="grid grid-rows-2 gap-4 snap-start">
          <a href="./img/cabinet-3.png" data-pswp-width="1280" data-pswp-height="720">
            <img src="./img/cabinet-3.png" class="w-full h-full object-cover rounded-lg hover:scale-105 transition-transform" alt="">
          </a>
          <a href="./img/cabinet-4.jpg" data-pswp-width="1280" data-pswp-height="720">
            <img src="./img/cabinet-4.jpg" class="w-full h-full object-cover rounded-lg hover:scale-105 transition-transform" alt="">
          </a>
        </div>

        <div class="grid grid-rows-2 gap-4 snap-start">
          <a href="https://picsum.photos/1200/900?random=5" data-pswp-width="1280" data-pswp-height="720">
            <img src="https://picsum.photos/400/300?random=5" class="w-full h-full object-cover rounded-lg hover:scale-105 transition-transform" alt="">
          </a>
          <a href="https://picsum.photos/1200/900?random=6" data-pswp-width="1280" data-pswp-height="720">
            <img src="https://picsum.photos/400/300?random=6" class="w-full h-full object-cover rounded-lg hover:scale-105 transition-transform" alt="">
          </a>
        </div>

        <div class="grid grid-rows-2 gap-4 snap-start">
          <a href="https://picsum.photos/1200/900?random=7" data-pswp-width="1280" data-pswp-height="720">
            <img src="https://picsum.photos/400/300?random=7" class="w-full h-full object-cover rounded-lg hover:scale-105 transition-transform" alt="">
          </a>
          <a href="https://picsum.photos/1200/900?random=8" data-pswp-width="1280" data-pswp-height="720">
            <img src="https://picsum.photos/400/300?random=8" class="w-full h-full object-cover rounded-lg hover:scale-105 transition-transform" alt="">
          </a>
        </div>
      </div>
    </div>

    <!-- PhotoSwipe ESM -->
    <script type="module">
      import PhotoSwipeLightbox from "https://unpkg.com/photoswipe@5/dist/photoswipe-lightbox.esm.js";
      import PhotoSwipe from "https://unpkg.com/photoswipe@5/dist/photoswipe.esm.js";

      const lightbox = new PhotoSwipeLightbox({
        gallery: "#galleryContainer",
        children: "a",
        pswpModule: PhotoSwipe,
      });
      lightbox.init();

      // Slider controls
      const container = document.getElementById("galleryContainer");
      document.getElementById("prevBtn").addEventListener("click", () => {
        container.scrollBy({ left: -container.clientWidth / 1.2, behavior: "smooth" });
      });
      document.getElementById("nextBtn").addEventListener("click", () => {
        container.scrollBy({ left: container.clientWidth / 1.2, behavior: "smooth" });
      });
    </script>

  </body>
</html>
